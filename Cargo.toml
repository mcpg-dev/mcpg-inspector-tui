[package]
name = "mcpg-inspector-tui"
version = "0.1.0-beta.25"
edition = "2024"
license = "Apache-2.0"
description = "The terminal face of mcpg-inspector — screens, keys, and the port they read through"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
# Pinned to the crossterm line already in the lock (via duckdb/arrow), so the
# tree carries one crossterm rather than two.
ratatui = "0.30"
# `stream` is what makes the subscription reader possible: the SSE body is
# consumed as it arrives, not after it ends.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
